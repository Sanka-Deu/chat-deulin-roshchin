<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Дополнительные стили для двухколоночного чата */
        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .users-panel {
            width: 280px;
            background: #f9fafb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .users-header {
            padding: 1.25rem;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1f2937;
            background: #ffffff;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }

        .user-item:hover {
            background: #f3f4f6;
        }

        .user-item.active {
            background: #eef2ff;
            border-left-color: #2563eb;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1f2937;
            margin-right: 12px;
            text-transform: uppercase;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 500;
            color: #111827;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message {
            max-width: 70%;
            padding: 0.6rem 1rem;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-owner {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-deliver {
            background: #f3f4f6;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.7;
        }

        .input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 0.75rem;
            background: white;
        }

        #mes_input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 40px;
            font-family: inherit;
            outline: none;
        }

        #mes_input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        #send_mes {
            width: auto;
            padding: 0.7rem 1.5rem;
            margin-top: 0;
            background: #2563eb;
            border-radius: 40px;
        }

        .empty-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            font-size: 0.95rem;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Передаём данные текущего пользователя -->
    <div id="chat-data" data-owner-id="{{ owner.id }}"></div>

    <div class="chat-container">
        <!-- Левая панель: пользователи -->
        <div class="users-panel">
            <div class="users-header">Пользователи</div>
            <div class="users-list">
                {% for user in all_users %}
                {% if user.id != owner.id %}
                <div class="user-item" data-user-id="{{ user.id }}" data-name="{{ user.name }}"
                    data-surname="{{ user.surname }}">
                    <div class="user-avatar">{{ user.name[0] }}{{ user.surname[0] }}</div>
                    <div class="user-info">
                        <div class="user-name">{{ user.name }} {{ user.surname }}</div>
                        <div style="font-size: 0.75rem; color: #6b7280;">{{ user.login }}</div>
                    </div>
                </div>
                {% endif %}
                {% endfor %}
            </div>
            <div style="padding: 1rem; border-top: 1px solid #e5e7eb;">
                <a href="{{ url_for('logout') }}" class="logout-btn"
                    style="display: block; text-align: center;">Выйти</a>
            </div>
        </div>

        <!-- Правая панель: диалог -->
        <div class="chat-panel">
            <div class="chat-header">
                <span id="chat-header-title">Чат</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Выйти</a>
            </div>
            <div class="messages-area" id="messages-area">
                <div class="empty-chat">Выберите пользователя, чтобы начать чат</div>
            </div>
            <div class="input-area">
                <input type="text" id="mes_input" placeholder="Введите сообщение..." autocomplete="off">
                <button id="send_mes">Отправить</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            var ownerId = parseInt($('#chat-data').data('owner-id'));
            var currentDeliverId = null;
            var pollingInterval = null;

            function formatDateTime(dateStr) {
                if (!dateStr) return '';
                var date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;

                var day = date.getDate().toString().padStart(2, '0');
                var month = (date.getMonth() + 1).toString().padStart(2, '0');
                var hours = date.getHours().toString().padStart(2, '0');
                var minutes = date.getMinutes().toString().padStart(2, '0');

                return day + '.' + month + ' ' + hours + ':' + minutes;
            }

            // Рендер сообщений с сохранением прокрутки
            var lastScrollPosition = 0;
            var wasAtBottom = false;

            function renderMessages(messages, preserveScroll) {
                var $msgArea = $('#messages-area');
                // Запоминаем текущую прокрутку и флаг "внизу"
                if (preserveScroll) {
                    lastScrollPosition = $msgArea.scrollTop();
                    var maxScroll = $msgArea[0].scrollHeight - $msgArea.height();
                    wasAtBottom = (lastScrollPosition >= maxScroll - 10); // допуск 10px
                }

                $msgArea.empty();
                if (!messages || messages.length === 0) {
                    $msgArea.html('<div class="empty-chat">Нет сообщений. Напишите что-нибудь!</div>');
                    if (preserveScroll && !wasAtBottom) $msgArea.scrollTop(lastScrollPosition);
                    return;
                }

                for (var i = 0; i < messages.length; i++) {
                    var msg = messages[i];
                    var isOwner = (msg.ownerId == ownerId);
                    var $msgDiv = $('<div class="message ' + (isOwner ? 'message-owner' : 'message-deliver') + '">')
                        .text(msg.text);
                    if (msg.date) {
                        var dateFormatted = formatDateTime(msg.date);
                        $msgDiv.append('<div class="message-info">' + dateFormatted + '</div>');
                    }
                    $msgArea.append($msgDiv);
                }

                // Восстанавливаем прокрутку
                if (preserveScroll) {
                    if (wasAtBottom) {
                        // Если пользователь был внизу – прокручиваем вниз после рендера
                        $msgArea.scrollTop($msgArea[0].scrollHeight);
                    } else {
                        $msgArea.scrollTop(lastScrollPosition);
                    }
                } else {
                    // Первая загрузка – прокручиваем вниз
                    $msgArea.scrollTop($msgArea[0].scrollHeight);
                }
            }

            function loadMessages(deliverId, preserveScroll) {
                if (!deliverId) return;
                currentDeliverId = deliverId;
                $.get('/api/messages', { user1: ownerId, user2: deliverId })
                    .done(function (messages) {
                        renderMessages(messages, preserveScroll);
                    })
                    .fail(function () {
                        alert('Ошибка загрузки сообщений');
                    });
            }

            // Автообновление (polling) с сохранением прокрутки
            function startPolling() {
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(function () {
                    if (currentDeliverId) {
                        loadMessages(currentDeliverId, true);  // true – сохранять прокрутку
                    }
                }, 4000);
            }

            // Обработка клика по пользователю
            $(document).on('click', '.user-item', function () {
                var userId = $(this).data('user-id');
                var userName = $(this).data('name');
                var userSurname = $(this).data('surname');
                $('#chat-header-title').text('Чат с ' + userName + ' ' + userSurname);
                // При клике прокрутку вниз не сохраняем (всегда вниз)
                loadMessages(userId, false);
                $('.user-item').removeClass('active');
                $(this).addClass('active');
                startPolling();
            });

            // Отправка сообщения (после отправки – перезагружаем сообщения, прокрутка вниз)
            $('#send_mes').on('click', function () {
                var $btn = $(this);
                var text = $('#mes_input').val();
                if (!text.trim()) {
                    alert('Введите сообщение');
                    return;
                }
                if (text.length > 2000) {
                    alert('Сообщение не должно превышать 2000 символов');
                    return;
                }
                if (!currentDeliverId) {
                    alert('Сначала выберите собеседника');
                    return;
                }
                $btn.prop('disabled', true).text('Отправка...');
                $.ajax({
                    url: '/api/messages',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        owner: ownerId,
                        deliver: currentDeliverId,
                        text: text.trim()
                    })
                }).done(function () {
                    $('#mes_input').val('');
                    loadMessages(currentDeliverId, false); // после отправки – вниз
                }).fail(function (xhr) {
                    var err = xhr.responseJSON ? xhr.responseJSON.error : 'Ошибка отправки';
                    alert(err);
                }).always(function () {
                    $btn.prop('disabled', false).text('Отправить');
                });
            });

            // Отправка по Enter
            $('#mes_input').on('keypress', function (e) {
                if (e.which === 13) {
                    $('#send_mes').click();
                }
            });

            // При загрузке страницы – если есть активный пользователь (например, из старого URL)
            var activeUser = $('.user-item.active').first();
            if (activeUser.length) {
                var userId = activeUser.data('user-id');
                var userName = activeUser.data('name');
                var userSurname = activeUser.data('surname');
                $('#chat-header-title').text('Чат с ' + userName + ' ' + userSurname);
                loadMessages(userId, false);
                startPolling();
            } else {
                // Если активного нет – просто показываем пустую область
                $('#messages-area').html('<div class="empty-chat">Выберите пользователя, чтобы начать чат</div>');
            }
        });
    </script>
</body>

</html>
